[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cachewise"
version = "0.1.0"
description = "Fixture-backed support assistant and measured uncached LLM baseline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "redis>=5.2,<9",
  "pydantic-settings>=2.8,<3",
  "uvicorn>=0.34,<1",
  "streamlit>=1.45,<2",
]

[project.scripts]
cachewise = "cachewise.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/cachewise"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
