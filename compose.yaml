services:
  api:
    build:
      context: .
      network: host
    # Linux host networking reaches the native vLLM server bound to 127.0.0.1.
    # The API also binds only to loopback; there are no public port mappings.
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      CACHEWISE_GENERATION_BASE_URL: ${CACHEWISE_GENERATION_BASE_URL:-http://127.0.0.1:8001/v1}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
  dashboard:
    build:
      context: .
      network: host
    network_mode: host
    environment:
      CACHEWISE_DASHBOARD_API_URL: ${CACHEWISE_DASHBOARD_API_URL:-http://127.0.0.1:8000}
      CACHEWISE_DASHBOARD_ARTIFACTS_DIR: /app/artifacts
    volumes:
      - ./artifacts:/app/artifacts:ro
    command: ["streamlit", "run", "src/cachewise/dashboard.py", "--server.address=127.0.0.1", "--server.port=8501", "--server.headless=true", "--browser.gatherUsageStats=false"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  redis:
    image: redis:8.2-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 2s
      retries: 3

volumes:
  redis-data:
